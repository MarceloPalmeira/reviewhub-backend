server {
  listen 80;
  location = /product.json { alias /etc/reviewhub/product.json; }
  # Saúde de cada microsserviço, usada pelo painel da interface.
  location = /health/identity { proxy_pass http://identity:8000/health; }
  location = /health/catalog { proxy_pass http://catalog:8000/health; }
  location = /health/reviews { proxy_pass http://reviews:8000/health; }
  location = /health/recommendations { proxy_pass http://recommendations:8000/health; }
  location /api/v1/auth/ { proxy_pass http://identity:8000; }
  location /api/v1/users/ { proxy_pass http://identity:8000; }
  location /api/v1/external { proxy_pass http://catalog:8000; }
  location /api/v1/lists { proxy_pass http://catalog:8000; }
  location /api/v1/contents { proxy_pass http://catalog:8000; }
  location /api/v1/domains { proxy_pass http://catalog:8000; }
  location /api/v1/feed { proxy_pass http://reviews:8000; }
  location /api/v1/reviews { proxy_pass http://reviews:8000; }
  location /api/v1/recommendations { proxy_pass http://recommendations:8000; }
}
