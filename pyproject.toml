[project]
name = "reviewhub-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pydantic>=2.0", "pyyaml>=6.0", "httpx>=0.27", "pyjwt>=2.9", "pwdlib[argon2]>=0.2", "alembic>=1.13"]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
[project.scripts]
reviewhub = "reviewhub_core.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["reviewhub_core", "services"]
