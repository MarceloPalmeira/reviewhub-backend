services:
  db:
    image: postgres:16-alpine
    mem_limit: ${DB_MEMORY_LIMIT:-384m}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=60"]
    environment:
      POSTGRES_USER: reviewhub
      POSTGRES_PASSWORD: reviewhub_dev
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewhub -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
  identity:
    mem_limit: ${IDENTITY_MEMORY_LIMIT:-${API_MEMORY_LIMIT:-320m}}
    image: reviewhub-backend:local
    build: .
    command: uvicorn services.identity.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      IDENTITY_DATABASE_URL: postgresql+psycopg://identity_service:identity_dev@db/identity
      PRODUCT_CONFIG: /config/product.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ${PRODUCT_DIR:-./generated}:/config:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck: &service_health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports: ["${IDENTITY_PORT:-8001}:8000"]
  catalog:
    mem_limit: ${API_MEMORY_LIMIT:-320m}
    image: reviewhub-backend:local
    build: .
    command: uvicorn services.catalog.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      PRODUCT_CONFIG: /config/product.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      CATALOG_DATABASE_URL: postgresql+psycopg://catalog_service:catalog_dev@db/catalog
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      FOOTBALL_DATA_API_TOKEN: ${FOOTBALL_DATA_API_TOKEN:-}
      MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT:-}
    volumes:
      - ${PRODUCT_DIR:-./generated}:/config:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck: *service_health
    ports: ["${CATALOG_PORT:-8002}:8000"]
  reviews:
    mem_limit: ${API_MEMORY_LIMIT:-320m}
    image: reviewhub-backend:local
    build: .
    command: uvicorn services.reviews.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      PRODUCT_CONFIG: /config/product.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      CATALOG_URL: http://catalog:8000
      IDENTITY_URL: http://identity:8000
      REVIEWS_DATABASE_URL: postgresql+psycopg://reviews_service:reviews_dev@db/reviews
    volumes:
      - ${PRODUCT_DIR:-./generated}:/config:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck: *service_health
    ports: ["${REVIEWS_PORT:-8003}:8000"]
  gateway:
    image: nginx:alpine
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-64m}
    command: ["/bin/sh", "-c", "sed -i 's/worker_processes  auto;/worker_processes  1;/' /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PRODUCT_DIR:-./generated}:/etc/reviewhub:ro
    ports: ["${GATEWAY_PORT:-8080}:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/product.json"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      identity: {condition: service_healthy}
      catalog: {condition: service_healthy}
      reviews: {condition: service_healthy}
  frontend:
    image: reviewhub-frontend:local
    build: ../reviewhub-frontend
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    ports: ["${FRONTEND_PORT:-5173}:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      gateway: {condition: service_healthy}
volumes:
  pgdata:
